services:
  - type: web
    name: photo-gallery
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_CHANNEL
        value: photo-gallery:events
      - key: WS_ALLOWED_ORIGINS
        sync: false
